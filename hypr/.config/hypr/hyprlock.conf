
# ~/.config/hypr/hyprlock.conf
#
# Note: hyprlock is a SEPARATE project from Hyprland itself, and it still
# uses this classic key=value .conf format — it hasn't adopted the new
# Lua hl.* config API that Hyprland the compositor moved to in 0.55.
# So this stays a .conf file (that's the correct/expected format here,
# not a downgrade from your Lua setup).
#
# Recreates: blurred wallpaper bg, big centered date/time, circular
# avatar with a small label under it, username, and a pill-shaped
# "Enter Password" field — matching the screenshot.

$avatar = ~/.config/hypr/hyprlock-files/avatar.png     # <- swap in your own square image
$wallpaper = ~/.config/hypr/hyprlock-files/wallpaper.png  # <- swap in your wallpaper

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 1.0
    brightness = 0.85
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# ---- Date (small, above the time) ----
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %B %-d')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 26
    font_family = Rubik
    position = 0, 380
    halign = center
    valign = center
}

# ---- Time (large, bold) ----
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(255, 255, 255, 1.0)
    font_size = 110
    font_family = Rubik
    position = 0, 280
    halign = center
    valign = center
}

# ---- Circular avatar ----
image {
    monitor =
    path = $avatar
    size = 80
    rounding = -1         # -1 = fully circular
    border_size = 0
    position = 0, -300
    halign = center
    valign = center
}

# ---- Small label overlaid on avatar (like "sane." in the screenshot) ----
label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.95)
    font_size = 13
    font_family = Rubik
    position = 0, 40
    halign = center
    valign = center
}

# ---- Username under avatar ----
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 18
    font_family = Rubik
    position = 0, -400
    halign = center
    valign = center
}

# ---- Pill-shaped password field ----
input-field {
    monitor =
    size = 220, 42
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.18)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffcc">Enter Password</span>
    hide_input = false
    rounding = -1           # fully rounded pill
    check_color = rgba(255, 255, 255, 0.8)
    fail_color = rgba(255, 100, 100, 0.9)
    fail_text = <i>Wrong password</i>
    position = 0, -460
    halign = center
    valign = center
}
