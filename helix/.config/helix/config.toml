theme = "catppuccin_mocha"

## ------------------------------------------------------------------------------ ##

[editor]
line-number = "relative"
bufferline = "always"
color-modes = true
cursorline = true

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline" 

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name"]
center = ["file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]
separator = "│"

[editor.statusline.mode]
normal = "NORMAL"
insert = "INSERT"
select = "SELECT"

[editor.file-picker]
hidden = false

[editor.lsp]
display-messages = true
display-inlay-hints = true

## ------------------------------------------------------------------------------ ##

[keys.normal]

esc = ["collapse_selection", "keep_primary_selection"]

## -- WINDOW RELATED REMAPS -- ##
C-e = [
  ":sh rm -f /tmp/helix-yazi",
  ":insert-output yazi '%{buffer_name}' --chooser-file=/tmp/helix-yazi",
  ":open %sh{cat /tmp/helix-yazi}",
  ":redraw"
]

## -- MOTION RELATED REMAPS IN NORMAL MODE -- ##
"<" = ["goto_prev_paragraph", "collapse_selection"]
">" = ["goto_next_paragraph", "collapse_selection", "move_visual_line_down"]

# -- BUFFER RELATED REMAPS IN NORMAL MODE -- ##
"A-right" = ":buffer-next"
"A-left" = ":buffer-previous"
"A-w" = ":buffer-close"

## -- YANKING RELATED REMAPS -- ##
"y" = ["yank", "yank_to_clipboard"]
"p" = "paste_clipboard_after"
"P" = "paste_clipboard_before"

## ------------------------------------------------------------------------------- ##

[keys.select]

## -- YANKING RELATED REMAPS -- ##
"y" = ["yank", "yank_to_clipboard"]
"p" = "replace_selections_with_clipboard"

## -- MOTION RELATED KEYMAPS IN SELECT MODE -- ##
"<" = ["goto_prev_paragraph"]
">" = ["goto_next_paragraph", "move_visual_line_down"]
